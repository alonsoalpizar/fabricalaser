<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Configuraci&oacute;n General | Admin FabricaLaser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../admin.css">
  <style>
    .config-grid {
      display: grid;
      gap: 1.5rem;
    }

    /* Card container — alineado con el design system del panel (.card usa --bg-card).
       Antes usaba --white (#FFFFFF) que rompía el tema oscuro con un bloque blanco. */
    .category-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    /* Header de categoría: un tick más claro que el card body para separación visual,
       NO más oscuro que el fondo global como antes (se veía como un agujero negro). */
    .category-header {
      padding: 1rem 1.5rem;
      background: var(--bg-card-hover);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .category-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .category-icon svg {
      width: 20px;
      height: 20px;
    }

    .category-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    .category-subtitle {
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .config-list {
      padding: 0;
    }

    .config-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 1.5rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-light);
      transition: background 0.15s;
    }

    .config-item:last-child { border-bottom: none; }

    .config-item:hover {
      background: var(--bg-warm);
    }

    .config-info {
      min-width: 0;
    }

    .config-key {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.8125rem;
      color: var(--accent);
      margin-bottom: 0.375rem;
      font-weight: 500;
    }

    .config-description {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .config-value-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .config-value-display {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      padding: 0.375rem 0.75rem;
      min-width: 60px;
      max-width: 280px;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Valor "vacío" — más gris, más discreto */
    .config-value-display.empty {
      color: var(--text-muted);
      font-style: italic;
      font-weight: 400;
    }

    /* Badge de seguridad para llm_api_key cifrada */
    .config-value-encrypted {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.75rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 6px;
      font-size: 0.8125rem;
      color: #10b981;
      font-weight: 500;
    }

    .config-value-encrypted svg {
      width: 14px;
      height: 14px;
    }

    /* Badge "configurar aquí" para keys protegidas */
    .config-value-protected {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.75rem;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-size: 0.8125rem;
      color: var(--accent);
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s;
    }

    .config-value-protected:hover {
      background: var(--accent);
      color: var(--white);
    }

    .config-value-protected svg { width: 14px; height: 14px; }

    .config-value-input {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text);
      background: var(--bg-warm);
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      min-width: 120px;
      width: 180px;
      text-align: right;
    }

    .config-value-input:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .config-edit-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 6px;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .config-edit-btn svg {
      width: 18px;
      height: 18px;
    }

    .config-edit-btn:hover {
      background: var(--bg-warm);
      color: var(--accent);
      border-color: var(--border);
    }

    .config-edit-btn.save { color: #10b981; }
    .config-edit-btn.save:hover { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.3); color: #10b981; }

    .config-edit-btn.cancel { color: #ef4444; }
    .config-edit-btn.cancel:hover { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3); color: #ef4444; }

    /* Categorías — iconos con color semántico */
    .category-speeds .category-icon      { background: rgba(59, 130, 246, 0.12);  color: #3b82f6; }
    .category-times .category-icon       { background: rgba(16, 185, 129, 0.12);  color: #10b981; }
    .category-complexity .category-icon  { background: rgba(234, 179, 8, 0.12);   color: #eab308; }
    .category-pricing .category-icon     { background: rgba(184, 84, 62, 0.15);   color: var(--accent); }
    .category-quotes .category-icon      { background: rgba(147, 51, 234, 0.12);  color: #9333ea; }
    .category-llm .category-icon         { background: rgba(34, 211, 238, 0.12);  color: #22d3ee; }
    .category-operational .category-icon { background: rgba(168, 162, 158, 0.12); color: #a8a29e; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <header class="content-header">
        <div>
          <h1 class="content-title">Configuraci&oacute;n General</h1>
          <div class="content-breadcrumb">
            <a href="/admin/">Dashboard</a>
            <span>/</span>
            <span>Configuraci&oacute;n</span>
            <span>/</span>
            <span>General</span>
          </div>
        </div>
        <button class="btn btn-primary" onclick="openCreateModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Nueva Configuraci&oacute;n
        </button>
      </header>

      <div class="content-body">
        <div class="config-grid" id="configGrid">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal-overlay" id="itemModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Nueva Configuraci&oacute;n</h3>
        <button class="modal-close" onclick="closeModal('itemModal')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="itemForm" onsubmit="saveItem(event)">
        <div class="modal-body">
          <input type="hidden" id="itemId" value="">

          <div class="form-group">
            <label class="form-label">Clave de Configuraci&oacute;n *</label>
            <input type="text" class="form-input" id="itemKey" required placeholder="Ej: base_cut_speed">
            <span class="form-hint">Identificador &uacute;nico en snake_case</span>
          </div>

          <div class="form-group">
            <label class="form-label">Valor *</label>
            <input type="text" class="form-input" id="itemValue" required placeholder="Ej: 20">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Tipo de Valor *</label>
              <select class="form-select" id="itemValueType">
                <option value="string">Texto</option>
                <option value="number">N&uacute;mero</option>
                <option value="boolean">Booleano</option>
                <option value="json">JSON</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Categor&iacute;a *</label>
              <select class="form-select" id="itemCategory">
                <option value="speeds">Velocidades</option>
                <option value="times">Tiempos</option>
                <option value="complexity">Complejidad</option>
                <option value="pricing">Precios</option>
                <option value="quotes">Cotizaciones</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Descripci&oacute;n</label>
            <textarea class="form-textarea" id="itemDescription" placeholder="Descripci&oacute;n de la configuraci&oacute;n..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('itemModal')">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-header">
        <h3 class="modal-title">Confirmar eliminaci&oacute;n</h3>
        <button class="modal-close" onclick="closeModal('deleteModal')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p>&iquest;Est&aacute; seguro de eliminar <strong id="deleteItemName"></strong>?</p>
        <p class="text-muted" style="margin-top: 0.5rem; font-size: 0.875rem;">Esta acci&oacute;n no se puede deshacer.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('deleteModal')">Cancelar</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Eliminar</button>
      </div>
    </div>
  </div>

  <script src="../admin.js"></script>
  <script>
    const ENDPOINT = '/admin/system-config';
    const ENTITY_NAME = 'Configuraci\u00f3n';
    let items = [];
    let deleteItemId = null;
    let editingId = null;

    const categoryIcons = {
      speeds: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>',
      times: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
      complexity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>',
      pricing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>',
      quotes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>'
    };

    const categoryLabels = {
      speeds: { title: 'Velocidades', subtitle: 'Velocidades de corte y grabado' },
      times: { title: 'Tiempos', subtitle: 'Tiempos de configuraci\u00f3n y preparaci\u00f3n' },
      complexity: { title: 'Complejidad', subtitle: 'Umbrales de aprobaci\u00f3n autom\u00e1tica' },
      pricing: { title: 'Precios', subtitle: 'Configuraci\u00f3n de precios base' },
      quotes: { title: 'Cotizaciones', subtitle: 'Par\u00e1metros de cotizaciones' }
    };

    // Agregado: iconos + labels para categorías llm y operational.
    // Antes caían en "Otras configuraciones" con icono genérico.
    categoryIcons.llm         = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="10" r="1.5" fill="currentColor"></circle><circle cx="15.5" cy="10" r="1.5" fill="currentColor"></circle><path d="M8 15.5s1.5 2 4 2 4-2 4-2"></path></svg>';
    categoryIcons.operational = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>';
    categoryLabels.llm         = { title: 'Proveedor LLM',    subtitle: 'Modelo de IA activo y credenciales cifradas' };
    categoryLabels.operational = { title: 'Operacional',      subtitle: 'Asesores, límites diarios y canales de atención' };

    // Claves protegidas — no se editan inline desde esta página.
    // Editarlas aquí rompería encriptación AES-GCM (llm_api_key), o requiere
    // flujo específico (provider dispara hot reload). Se redirige al gestor a
    // la página dedicada /admin/configuracion-llm.html
    const PROTECTED_KEYS = {
      llm_api_key:  { href: '/admin/configuracion-llm.html', label: 'Configurar aquí' },
      llm_provider: { href: '/admin/configuracion-llm.html', label: 'Configurar aquí' },
      llm_model:    { href: '/admin/configuracion-llm.html', label: 'Configurar aquí' },
      llm_endpoint: { href: '/admin/configuracion-llm.html', label: 'Configurar aquí' }
    };

    async function loadItems() {
      const container = document.getElementById('configGrid');
      container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const data = await apiGet(ENDPOINT);
        items = data.data || [];
        renderGrid();
      } catch (err) {
        console.error('Failed to load items:', err);
        container.innerHTML = `<div class="empty-state"><p class="text-error">Error: ${err.message}</p></div>`;
      }
    }

    function groupByCategory(items) {
      const groups = {};
      items.forEach(item => {
        if (!groups[item.category]) {
          groups[item.category] = [];
        }
        groups[item.category].push(item);
      });
      return groups;
    }

    function renderGrid() {
      const container = document.getElementById('configGrid');

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <p>No hay configuraciones</p>
          </div>
        `;
        return;
      }

      const groups = groupByCategory(items);
      // Orden: llm y operational arriba (config crítica que el gestor edita más seguido),
      // luego el resto. Cualquier categoría desconocida va al final como fallback.
      const categoryOrder = ['llm', 'operational', 'pricing', 'quotes', 'speeds', 'times', 'complexity'];

      let html = '';
      categoryOrder.forEach(category => {
        if (groups[category] && groups[category].length > 0) {
          const label = categoryLabels[category] || { title: category, subtitle: '' };
          html += `
            <div class="category-section category-${category}">
              <div class="category-header">
                <div class="category-icon">${categoryIcons[category] || ''}</div>
                <div>
                  <div class="category-title">${label.title}</div>
                  <div class="category-subtitle">${label.subtitle}</div>
                </div>
              </div>
              <div class="config-list">
                ${groups[category].map(item => renderConfigItem(item)).join('')}
              </div>
            </div>
          `;
        }
      });

      // Render any uncategorized items
      Object.keys(groups).forEach(category => {
        if (!categoryOrder.includes(category)) {
          html += `
            <div class="category-section">
              <div class="category-header">
                <div class="category-icon">${categoryIcons[category] || ''}</div>
                <div>
                  <div class="category-title">${category}</div>
                  <div class="category-subtitle">Otras configuraciones</div>
                </div>
              </div>
              <div class="config-list">
                ${groups[category].map(item => renderConfigItem(item)).join('')}
              </div>
            </div>
          `;
        }
      });

      container.innerHTML = html;
    }

    // Escapa caracteres que podrían romper HTML al inyectar values dinámicos.
    // Importante para títulos con comillas y para mostrar ciphertexts base64 sin corrupción.
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderConfigItem(item) {
      const isEditing = editingId === item.id;
      const isProtected = PROTECTED_KEYS[item.config_key];
      const isEncryptedKey = item.config_key === 'llm_api_key';
      const hasValue = item.config_value && item.config_value.length > 0;

      // Valor mostrado:
      // - llm_api_key con valor → badge verde "Cifrada" + preview truncado
      // - llm_api_key vacío     → "sin configurar"
      // - otros protegidos      → valor tal cual, pero sin botón editar
      // - resto                 → valor normal, con edit/delete
      let valueDisplay;
      if (isEncryptedKey) {
        valueDisplay = hasValue
          ? `<span class="config-value-encrypted" title="Encriptada AES-256-GCM (${item.config_value.length} chars base64)">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
               Cifrada
             </span>`
          : `<span class="config-value-display empty">sin configurar</span>`;
      } else {
        const shown = hasValue ? escapeHtml(String(item.config_value)) : 'sin valor';
        valueDisplay = `<span class="config-value-display ${hasValue ? '' : 'empty'}" title="${hasValue ? escapeHtml(String(item.config_value)) : ''}">${shown}</span>`;
      }

      return `
        <div class="config-item" data-id="${item.id}">
          <div class="config-info">
            <div class="config-key">${item.config_key}</div>
            <div class="config-description">${item.description || '—'}</div>
          </div>
          <div class="config-value-wrapper">
            ${isEditing ? `
              <input type="text" class="config-value-input" id="edit-value-${item.id}" value="${escapeHtml(String(item.config_value || ''))}" onkeydown="handleEditKeydown(event, ${item.id})">
              <button class="config-edit-btn save" onclick="saveInlineEdit(${item.id})" title="Guardar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <button class="config-edit-btn cancel" onclick="cancelInlineEdit()" title="Cancelar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            ` : `
              ${valueDisplay}
              ${isProtected ? `
                <a href="${isProtected.href}" class="config-value-protected" title="Editar desde la página dedicada — protege encriptación y dispara hot reload">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                  ${isProtected.label}
                </a>
              ` : `
                <button class="config-edit-btn" onclick="startInlineEdit(${item.id})" title="Editar">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
                <button class="config-edit-btn" onclick="deleteItem(${item.id}, '${item.config_key}')" title="Eliminar">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
              `}
            `}
          </div>
        </div>
      `;
    }

    function startInlineEdit(id) {
      editingId = id;
      renderGrid();
      setTimeout(() => {
        const input = document.getElementById(`edit-value-${id}`);
        if (input) {
          input.focus();
          input.select();
        }
      }, 50);
    }

    function cancelInlineEdit() {
      editingId = null;
      renderGrid();
    }

    function handleEditKeydown(event, id) {
      if (event.key === 'Enter') {
        event.preventDefault();
        saveInlineEdit(id);
      } else if (event.key === 'Escape') {
        cancelInlineEdit();
      }
    }

    async function saveInlineEdit(id) {
      const input = document.getElementById(`edit-value-${id}`);
      if (!input) return;

      const newValue = input.value.trim();
      if (!newValue) {
        showToast('El valor no puede estar vac\u00edo', 'error');
        return;
      }

      try {
        await apiPut(`${ENDPOINT}/${id}`, { config_value: newValue });
        showToast('Configuraci\u00f3n actualizada', 'success');
        editingId = null;
        loadItems();
      } catch (err) {
        console.error('Failed to save:', err);
        showToast(err.message || 'Error al guardar', 'error');
      }
    }

    function openCreateModal() {
      document.getElementById('modalTitle').textContent = `Nueva ${ENTITY_NAME}`;
      document.getElementById('itemForm').reset();
      document.getElementById('itemId').value = '';
      document.getElementById('itemKey').disabled = false;
      document.getElementById('itemValueType').disabled = false;
      document.getElementById('itemCategory').disabled = false;
      openModal('itemModal');
    }

    async function saveItem(e) {
      e.preventDefault();

      const id = document.getElementById('itemId').value;
      const isNew = !id;

      const body = {
        config_key: document.getElementById('itemKey').value,
        config_value: document.getElementById('itemValue').value,
        value_type: document.getElementById('itemValueType').value,
        category: document.getElementById('itemCategory').value,
        description: document.getElementById('itemDescription').value || null
      };

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Guardando...';

      try {
        if (isNew) {
          await apiPost(ENDPOINT, body);
          showToast(`${ENTITY_NAME} creada`, 'success');
        } else {
          await apiPut(`${ENDPOINT}/${id}`, body);
          showToast(`${ENTITY_NAME} actualizada`, 'success');
        }

        closeModal('itemModal');
        loadItems();
      } catch (err) {
        console.error('Failed to save:', err);
        showToast(err.message || 'Error al guardar', 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Guardar';
      }
    }

    function deleteItem(id, name) {
      deleteItemId = id;
      document.getElementById('deleteItemName').textContent = name || 'este elemento';
      openModal('deleteModal');
    }

    async function confirmDelete() {
      if (!deleteItemId) return;

      try {
        await apiDelete(`${ENDPOINT}/${deleteItemId}`);
        showToast(`${ENTITY_NAME} eliminada`, 'success');
        closeModal('deleteModal');
        loadItems();
      } catch (err) {
        console.error('Failed to delete:', err);
        showToast(err.message || 'Error al eliminar', 'error');
      }

      deleteItemId = null;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const ready = await initAdmin('general');
      if (ready) loadItems();
    });
  </script>
</body>
</html>
